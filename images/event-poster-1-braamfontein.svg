<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1330"/>
      <stop offset="100%" stop-color="#053666"/>
    </linearGradient>
    <linearGradient id="overlay1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04091E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04091E" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#skyGrad1)"/>

  <!-- Sun/light glow -->
  <circle cx="640" cy="140" r="120" fill="#5be5d1" opacity="0.12"/>

  <!-- City skyline silhouette -->
  <g fill="#08152f">
    <rect x="0" y="340" width="70" height="180"/>
    <rect x="60" y="300" width="55" height="220"/>
    <rect x="110" y="360" width="90" height="160"/>
    <rect x="195" y="260" width="65" height="260"/>
    <rect x="255" y="330" width="50" height="190"/>
    <rect x="300" y="370" width="110" height="150"/>
    <rect x="405" y="290" width="60" height="230"/>
    <rect x="460" y="345" width="80" height="175"/>
    <rect x="535" y="255" width="70" height="265"/>
    <rect x="600" y="380" width="95" height="140"/>
    <rect x="690" y="315" width="60" height="205"/>
    <rect x="745" y="360" width="55" height="160"/>
  </g>
  <!-- windows -->
  <g fill="#5be5d1" opacity="0.35">
    <rect x="15" y="360" width="8" height="10"/>
    <rect x="35" y="360" width="8" height="10"/>
    <rect x="15" y="390" width="8" height="10"/>
    <rect x="35" y="390" width="8" height="10"/>
    <rect x="215" y="290" width="8" height="10"/>
    <rect x="235" y="290" width="8" height="10"/>
    <rect x="215" y="320" width="8" height="10"/>
    <rect x="235" y="320" width="8" height="10"/>
    <rect x="555" y="285" width="8" height="10"/>
    <rect x="575" y="285" width="8" height="10"/>
    <rect x="555" y="315" width="8" height="10"/>
    <rect x="575" y="315" width="8" height="10"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="510" width="800" height="90" fill="#062546"/>

  <!-- Dark overlay for text contrast -->
  <rect width="800" height="600" fill="url(#overlay1)"/>

  <!-- Broom icon -->
  <g transform="translate(80,90)">
    <circle cx="30" cy="30" r="34" fill="#5be5d1" opacity="0.15"/>
    <path d="M30 8 L30 40" stroke="#5be5d1" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 40 L42 40 L48 54 L12 54 Z" fill="#5be5d1"/>
    <path d="M14 54 L46 54 L44 60 L16 60 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Eyebrow label -->
  <text x="80" y="185" font-family="Roboto, sans-serif" font-size="15" letter-spacing="3" fill="#5be5d1" font-weight="700">CLEAN CITY EVENT</text>

  <!-- Title -->
  <text x="78" y="240" font-family="Lato, sans-serif" font-size="46" font-weight="900" fill="#ffffff">Braamfontein</text>
  <text x="78" y="288" font-family="Lato, sans-serif" font-size="46" font-weight="900" fill="#ffffff">Street Clean-Up</text>

  <!-- Subtitle -->
  <text x="80" y="326" font-family="Roboto, sans-serif" font-size="15" fill="#cfe9f0" opacity="0.9">Grab your gloves and help us clear the streets.</text>

  <!-- Date badge -->
  <g transform="translate(80,360)">
    <rect x="0" y="0" width="230" height="56" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="0" y="0" width="6" height="56" fill="#5be5d1"/>
    <text x="20" y="24" font-family="Roboto, sans-serif" font-size="12" letter-spacing="1.5" fill="#5be5d1" font-weight="700">DATE</text>
    <text x="20" y="45" font-family="Roboto, sans-serif" font-size="18" fill="#ffffff" font-weight="600">04 October 2026</text>
  </g>

  <!-- Location badge -->
  <g transform="translate(330,360)">
    <rect x="0" y="0" width="230" height="56" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="0" y="0" width="6" height="56" fill="#5be5d1"/>
    <text x="20" y="24" font-family="Roboto, sans-serif" font-size="12" letter-spacing="1.5" fill="#5be5d1" font-weight="700">AREA</text>
    <text x="20" y="45" font-family="Roboto, sans-serif" font-size="18" fill="#ffffff" font-weight="600">Braamfontein</text>
  </g>

  <!-- Bottom brand strip -->
  <rect x="0" y="560" width="800" height="40" fill="#053666"/>
  <text x="80" y="585" font-family="Lato, sans-serif" font-size="16" font-weight="700" fill="#ffffff">CLEAN CITY</text>
  <text x="720" y="585" font-family="Roboto, sans-serif" font-size="13" fill="#5be5d1" text-anchor="end">cleancity.org</text>
</svg>
