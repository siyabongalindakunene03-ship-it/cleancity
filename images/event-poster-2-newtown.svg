<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1330"/>
      <stop offset="100%" stop-color="#053666"/>
    </linearGradient>
    <linearGradient id="overlay2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04091E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04091E" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#skyGrad2)"/>

  <!-- Glow -->
  <circle cx="150" cy="130" r="130" fill="#5be5d1" opacity="0.12"/>

  <!-- City skyline silhouette (mirrored feel for Newtown) -->
  <g fill="#08152f">
    <rect x="760" y="330" width="45" height="190"/>
    <rect x="705" y="290" width="60" height="230"/>
    <rect x="630" y="350" width="80" height="170"/>
    <rect x="565" y="250" width="70" height="270"/>
    <rect x="500" y="320" width="60" height="200"/>
    <rect x="400" y="365" width="105" height="155"/>
    <rect x="330" y="280" width="65" height="240"/>
    <rect x="260" y="340" width="75" height="180"/>
    <rect x="185" y="245" width="70" height="275"/>
    <rect x="105" y="375" width="90" height="145"/>
    <rect x="45" y="305" width="55" height="215"/>
    <rect x="0" y="355" width="50" height="165"/>
  </g>
  <g fill="#5be5d1" opacity="0.35">
    <rect x="720" y="330" width="8" height="10"/>
    <rect x="740" y="330" width="8" height="10"/>
    <rect x="720" y="360" width="8" height="10"/>
    <rect x="740" y="360" width="8" height="10"/>
    <rect x="345" y="300" width="8" height="10"/>
    <rect x="365" y="300" width="8" height="10"/>
    <rect x="345" y="330" width="8" height="10"/>
    <rect x="365" y="330" width="8" height="10"/>
    <rect x="205" y="275" width="8" height="10"/>
    <rect x="225" y="275" width="8" height="10"/>
    <rect x="205" y="305" width="8" height="10"/>
    <rect x="225" y="305" width="8" height="10"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="510" width="800" height="90" fill="#062546"/>

  <!-- Overlay -->
  <rect width="800" height="600" fill="url(#overlay2)"/>

  <!-- Recycle icon -->
  <g transform="translate(80,90)">
    <circle cx="30" cy="30" r="34" fill="#5be5d1" opacity="0.15"/>
    <g fill="none" stroke="#5be5d1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 12 L38 24 L30 24 Z" fill="#5be5d1" stroke="none"/>
      <path d="M14 40 L22 26" />
      <path d="M46 40 L38 26" />
      <path d="M18 44 L42 44" />
    </g>
    <circle cx="30" cy="30" r="20" fill="none" stroke="#5be5d1" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.6"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="185" font-family="Roboto, sans-serif" font-size="15" letter-spacing="3" fill="#5be5d1" font-weight="700">CLEAN CITY WORKSHOP</text>

  <!-- Title -->
  <text x="78" y="240" font-family="Lato, sans-serif" font-size="46" font-weight="900" fill="#ffffff">Recycling 101</text>
  <text x="78" y="288" font-family="Lato, sans-serif" font-size="46" font-weight="900" fill="#ffffff">Workshop</text>

  <!-- Subtitle -->
  <text x="80" y="326" font-family="Roboto, sans-serif" font-size="15" fill="#cfe9f0" opacity="0.9">Learn to sort, reduce and recycle the right way.</text>

  <!-- Date badge -->
  <g transform="translate(80,360)">
    <rect x="0" y="0" width="230" height="56" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="0" y="0" width="6" height="56" fill="#5be5d1"/>
    <text x="20" y="24" font-family="Roboto, sans-serif" font-size="12" letter-spacing="1.5" fill="#5be5d1" font-weight="700">DATE</text>
    <text x="20" y="45" font-family="Roboto, sans-serif" font-size="18" fill="#ffffff" font-weight="600">18 October 2026</text>
  </g>

  <!-- Location badge -->
  <g transform="translate(330,360)">
    <rect x="0" y="0" width="230" height="56" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="0" y="0" width="6" height="56" fill="#5be5d1"/>
    <text x="20" y="24" font-family="Roboto, sans-serif" font-size="12" letter-spacing="1.5" fill="#5be5d1" font-weight="700">AREA</text>
    <text x="20" y="45" font-family="Roboto, sans-serif" font-size="18" fill="#ffffff" font-weight="600">Newtown</text>
  </g>

  <!-- Bottom brand strip -->
  <rect x="0" y="560" width="800" height="40" fill="#053666"/>
  <text x="80" y="585" font-family="Lato, sans-serif" font-size="16" font-weight="700" fill="#ffffff">CLEAN CITY</text>
  <text x="720" y="585" font-family="Roboto, sans-serif" font-size="13" fill="#5be5d1" text-anchor="end">cleancity.org</text>
</svg>
