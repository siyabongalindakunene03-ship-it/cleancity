<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1330"/>
      <stop offset="100%" stop-color="#053666"/>
    </linearGradient>
    <linearGradient id="overlay3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04091E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04091E" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#skyGrad3)"/>

  <!-- Glow, centered for "community day" feel -->
  <circle cx="400" cy="110" r="140" fill="#5be5d1" opacity="0.12"/>

  <!-- City skyline silhouette, taller/denser for Hillbrow -->
  <g fill="#08152f">
    <rect x="0" y="330" width="55" height="190"/>
    <rect x="50" y="270" width="65" height="250"/>
    <rect x="110" y="345" width="70" height="175"/>
    <rect x="175" y="235" width="60" height="285"/>
    <rect x="230" y="300" width="55" height="220"/>
    <rect x="280" y="355" width="95" height="165"/>
    <rect x="370" y="220" width="70" height="300"/>
    <rect x="435" y="290" width="60" height="230"/>
    <rect x="490" y="340" width="85" height="180"/>
    <rect x="570" y="245" width="65" height="275"/>
    <rect x="630" y="310" width="55" height="210"/>
    <rect x="680" y="360" width="70" height="160"/>
    <rect x="745" y="300" width="55" height="220"/>
  </g>
  <g fill="#5be5d1" opacity="0.35">
    <rect x="195" y="265" width="8" height="10"/>
    <rect x="215" y="265" width="8" height="10"/>
    <rect x="195" y="295" width="8" height="10"/>
    <rect x="215" y="295" width="8" height="10"/>
    <rect x="390" y="250" width="8" height="10"/>
    <rect x="410" y="250" width="8" height="10"/>
    <rect x="390" y="280" width="8" height="10"/>
    <rect x="410" y="280" width="8" height="10"/>
    <rect x="590" y="275" width="8" height="10"/>
    <rect x="610" y="275" width="8" height="10"/>
    <rect x="590" y="305" width="8" height="10"/>
    <rect x="610" y="305" width="8" height="10"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="510" width="800" height="90" fill="#062546"/>

  <!-- Overlay -->
  <rect width="800" height="600" fill="url(#overlay3)"/>

  <!-- People/community icon -->
  <g transform="translate(80,90)">
    <circle cx="30" cy="30" r="34" fill="#5be5d1" opacity="0.15"/>
    <circle cx="20" cy="20" r="7" fill="#5be5d1"/>
    <path d="M8 44 C8 32 32 32 32 44 Z" fill="#5be5d1"/>
    <circle cx="40" cy="20" r="7" fill="#5be5d1" opacity="0.75"/>
    <path d="M28 44 C28 32 52 32 52 44 Z" fill="#5be5d1" opacity="0.75"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="185" font-family="Roboto, sans-serif" font-size="15" letter-spacing="3" fill="#5be5d1" font-weight="700">CLEAN CITY COMMUNITY DAY</text>

  <!-- Title -->
  <text x="78" y="240" font-family="Lato, sans-serif" font-size="46" font-weight="900" fill="#ffffff">Hillbrow</text>
  <text x="78" y="288" font-family="Lato, sans-serif" font-size="46" font-weight="900" fill="#ffffff">Community Day</text>

  <!-- Subtitle -->
  <text x="80" y="326" font-family="Roboto, sans-serif" font-size="15" fill="#cfe9f0" opacity="0.9">Clean-ups, recycling and family fun, all in one day.</text>

  <!-- Date badge -->
  <g transform="translate(80,360)">
    <rect x="0" y="0" width="230" height="56" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="0" y="0" width="6" height="56" fill="#5be5d1"/>
    <text x="20" y="24" font-family="Roboto, sans-serif" font-size="12" letter-spacing="1.5" fill="#5be5d1" font-weight="700">DATE</text>
    <text x="20" y="45" font-family="Roboto, sans-serif" font-size="18" fill="#ffffff" font-weight="600">01 November 2026</text>
  </g>

  <!-- Location badge -->
  <g transform="translate(330,360)">
    <rect x="0" y="0" width="230" height="56" rx="6" fill="#ffffff" opacity="0.08"/>
    <rect x="0" y="0" width="6" height="56" fill="#5be5d1"/>
    <text x="20" y="24" font-family="Roboto, sans-serif" font-size="12" letter-spacing="1.5" fill="#5be5d1" font-weight="700">AREA</text>
    <text x="20" y="45" font-family="Roboto, sans-serif" font-size="18" fill="#ffffff" font-weight="600">Hillbrow</text>
  </g>

  <!-- Bottom brand strip -->
  <rect x="0" y="560" width="800" height="40" fill="#053666"/>
  <text x="80" y="585" font-family="Lato, sans-serif" font-size="16" font-weight="700" fill="#ffffff">CLEAN CITY</text>
  <text x="720" y="585" font-family="Roboto, sans-serif" font-size="13" fill="#5be5d1" text-anchor="end">cleancity.org</text>
</svg>
